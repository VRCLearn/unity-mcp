name: Validate VPM package

on:
  pull_request:
    paths:
      - .github/vpm/**
      - .github/workflows/vpm-*.yml
      - MCPForUnity/**
      - Server/pyproject.toml
      - LICENSE
      - VPM.md
      - manifest.json
  push:
    branches:
      - main
    paths:
      - .github/vpm/**
      - .github/workflows/vpm-*.yml
      - MCPForUnity/**
      - Server/pyproject.toml
      - LICENSE
      - VPM.md
      - manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and validate the VPM archive
        shell: pwsh
        run: ./.github/vpm/scripts/build-package.ps1 -Revision "$env:GITHUB_SHA"
