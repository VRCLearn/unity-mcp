name: Build VPM repository listing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/vpm/site/**
      - .github/vpm/source.json
      - .github/vpm/scripts/build-listing.ps1
      - .github/workflows/vpm-listing.yml
  release:
    types:
      - published
      - edited
      - deleted

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: vpm-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Build the VPM repository listing
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.github/vpm/scripts/build-listing.ps1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/vpm-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
