name: Build VPM repository listing

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - .github/vpm/**
      - .github/workflows/vpm-listing.yml
  release:
    types: [published, edited, deleted]

permissions:
  contents: read

concurrency:
  group: vpm-pages
  cancel-in-progress: true

jobs:
  request-release-refresh:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Refresh the legacy mirror on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run vpm-listing.yml --ref "$DEFAULT_BRANCH"
  build-and-deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Read the shared listing tools from the canonical repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VRCLearn/MCP-For-Unity-Launcher
          ref: main
          path: launcher-tools
          persist-credentials: false
      - name: Check whether the legacy mirror needs an update
        id: updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ]; then
            python launcher-tools/tools/check_listing.py --source .github/vpm/source.json
          else
            python launcher-tools/tools/check_listing.py --source .github/vpm/source.json --force
          fi
      - name: Build the compatible combined mirror and migration page
        if: steps.updates.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./.github/vpm/scripts/build-listing.ps1
      - name: Configure GitHub Pages
        if: steps.updates.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the migration artifact
        if: steps.updates.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/vpm-site
      - name: Deploy the legacy mirror
        if: steps.updates.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
