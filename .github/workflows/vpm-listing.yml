name: Build VPM repository listing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/vpm/source.json
      - .github/vpm/scripts/build-listing.ps1
      - .github/workflows/vpm-listing.yml
  release:
    types:
      - published
      - edited
      - deleted

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: vpm-pages
  cancel-in-progress: true

jobs:
  request-release-refresh:
    name: Queue a default-branch Pages refresh
    if: github.event_name == 'release'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the listing workflow on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run vpm-listing.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH"

  build-and-deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check out the official VPM website template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vrchat-community/template-package
          ref: 591e23fe5175b8279cc3998f65e81add604aabc9
          path: official-template

      - name: Check out the official VPM listing renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ci

      - name: Render the official VPM listing website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp .github/vpm/source.json official-template/source.json
          dotnet run \
            --project ci/PackageBuilder/PackageBuilder.csproj \
            --framework net8.0 \
            -- BuildRepoListing \
            --root ci \
            --package-listing-source-folder "$GITHUB_WORKSPACE/official-template" \
            --list-publish-directory "$GITHUB_WORKSPACE/official-template/Website" \
            --current-package-name com.coplaydev.unity-mcp \
            --current-listing-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.vpm-empty-index.json"

      - name: Build the VPM repository listing
        id: listing
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.github/vpm/scripts/build-listing.ps1 -SitePath official-template/Website

      - name: Ensure at least one package version exists
        if: steps.listing.outputs.package_count == '0'
        shell: bash
        run: |
          echo "No VPM package release was found." >&2
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/vpm-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
