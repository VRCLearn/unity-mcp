name: Sync upstream main

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vpm-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare upstream main merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      base_sha: ${{ steps.sync.outputs.base_sha }}
      changed: ${{ steps.sync.outputs.changed }}
      sync_branch: ${{ steps.sync.outputs.sync_branch }}
      sync_sha: ${{ steps.sync.outputs.sync_sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream main
        id: sync
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          base_sha="$(git rev-parse HEAD)"
          git remote add upstream https://github.com/CoplayDev/unity-mcp.git
          git fetch --force --no-tags upstream \
            refs/heads/main:refs/remotes/upstream/main
          upstream_sha="$(git rev-parse refs/remotes/upstream/main)"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sync_branch=" >> "$GITHUB_OUTPUT"
            echo "sync_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "The fork already contains upstream main at $upstream_sha."
            exit 0
          fi

          merge_base="$(git merge-base HEAD "$upstream_sha")"
          workflow_changes="$(
            git diff --name-only "$merge_base" "$upstream_sha" -- \
              .github/workflows
          )"
          if [[ -n "$workflow_changes" ]]; then
            echo "::error title=Use GitHub's Sync fork button::Upstream main changed workflow files that GITHUB_TOKEN cannot update."
            {
              echo "## Manual upstream synchronization required"
              echo
              echo "Upstream main at \`$upstream_sha\` changed workflow files:"
              echo
              echo '```text'
              echo "$workflow_changes"
              echo '```'
              echo
              echo "Open the repository's **Code** page and choose **Sync fork → Update branch**."
              echo "That user-authorized update can modify workflow files. Its push to \`main\` will trigger this workflow again automatically."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "$upstream_sha"
          git diff --check "$base_sha"..HEAD -- . ':(exclude,glob)**/*.meta'

          sync_branch="automation/upstream-main-${RUN_ID}"
          sync_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${sync_branch}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sync_branch=$sync_branch" >> "$GITHUB_OUTPUT"
          echo "sync_sha=$sync_sha" >> "$GITHUB_OUTPUT"
          echo "Prepared upstream main at $upstream_sha as $sync_sha."

      - name: Validate localization coverage
        if: steps.sync.outputs.changed == 'true'
        shell: pwsh
        run: ./.github/vpm/scripts/validate-localization.ps1

      - name: Build and validate the candidate VPM archive
        if: steps.sync.outputs.changed == 'true'
        shell: pwsh
        run: ./.github/vpm/scripts/build-package.ps1 -Revision "${{ steps.sync.outputs.sync_sha }}"

      - name: Keep scheduled synchronization active
        if: github.event_name == 'schedule' && steps.sync.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail

          now="$(date +%s)"
          last_commit="$(git log -1 --format=%ct)"
          maximum_idle_seconds="$((45 * 24 * 60 * 60))"
          if (( now - last_commit < maximum_idle_seconds )); then
            echo "The repository has been active within the last 45 days."
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep scheduled upstream synchronization active"
          git push origin HEAD:main

  unity_availability:
    name: Detect Unity test credentials
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - name: Detect Unity test credentials
        id: detect
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$UNITY_LICENSE" ]] || \
             { [[ -n "$UNITY_EMAIL" ]] && [[ -n "$UNITY_PASSWORD" ]] && [[ -n "$UNITY_SERIAL" ]]; }; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Unity test credentials are configured."
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Unity tests will be skipped because the repository has no Unity test credentials. Packaging, localization validation, and Python tests still gate promotion."

  unity_tests:
    name: Unity tests gate
    needs:
      - prepare
      - unity_availability
    if: >-
      needs.prepare.outputs.changed == 'true' &&
      needs.unity_availability.outputs.available == 'true'
    uses: ./.github/workflows/unity-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sync_sha }}
    secrets: inherit

  python_tests:
    name: Python tests gate
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/python-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sync_sha }}

  promote:
    name: Promote validated upstream main merge
    needs:
      - prepare
      - python_tests
      - unity_availability
      - unity_tests
    if: >-
      always() &&
      needs.prepare.outputs.changed == 'true' &&
      needs.python_tests.result == 'success' &&
      needs.unity_availability.result == 'success' &&
      (needs.unity_availability.outputs.available != 'true' ||
      needs.unity_tests.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the validated merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sync_sha }}

      - name: Fast-forward main
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$BASE_SHA" ]]; then
            echo "main changed while the upstream candidate was tested." >&2
            echo "Expected $BASE_SHA but found $current_main. Retry synchronization." >&2
            exit 1
          fi

          git push origin HEAD:main

  release:
    name: Synchronize the latest upstream release
    needs:
      - prepare
      - promote
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.changed == 'false' || needs.promote.result == 'success')
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/vpm-release.yml
    secrets: inherit

  cleanup:
    name: Remove temporary main synchronization branch
    needs:
      - prepare
      - promote
    if: always() && needs.prepare.outputs.sync_branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ needs.prepare.outputs.sync_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${SYNC_BRANCH}" \
            >/dev/null 2>&1 || true
