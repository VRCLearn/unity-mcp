name: Release VPM package

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: vpm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and validate the VPM archive
        id: package
        shell: pwsh
        run: ./.github/vpm/scripts/build-package.ps1 -Revision "$env:GITHUB_SHA"

      - name: Inspect the release state
        id: release
        env:
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            assets="$(
              gh release view "$RELEASE_TAG" \
                --json assets \
                --jq '.assets[].name'
            )"
            if grep -Fxq "$ARTIFACT_NAME" <<< "$assets"; then
              echo "action=none" >> "$GITHUB_OUTPUT"
              echo "Release $RELEASE_TAG is already complete."
            else
              echo "action=upload" >> "$GITHUB_OUTPUT"
              echo "Release $RELEASE_TAG exists but is missing $ARTIFACT_NAME."
            fi
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG exists without a GitHub release." >&2
            exit 1
          fi

          echo "action=create" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        if: steps.release.outputs.action == 'create'
        env:
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          DISPLAY_NAME: ${{ steps.package.outputs.display_name }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            "$ZIP_PATH#$ARTIFACT_NAME" \
            --target "$GITHUB_SHA" \
            --title "$DISPLAY_NAME $PACKAGE_VERSION" \
            --notes "VPM distribution of MCP for Unity $PACKAGE_VERSION from the VRCLearn fork. Source authorship and the MIT license remain with CoplayDev and the upstream contributors."

      - name: Repair a missing release asset
        if: steps.release.outputs.action == 'upload'
        env:
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$ZIP_PATH#$ARTIFACT_NAME"

      - name: Refresh the VPM repository listing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run vpm-listing.yml --ref main
