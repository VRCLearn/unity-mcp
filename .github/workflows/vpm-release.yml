name: Release VPM package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: vpm-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the upstream release snapshot
    runs-on: ubuntu-latest
    outputs:
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      changed: ${{ steps.candidate.outputs.changed }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      upstream_tag: ${{ steps.candidate.outputs.upstream_tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Build an exact upstream release snapshot with the fork overlay
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(git rev-parse HEAD)"
          upstream_tag="$(gh api repos/CoplayDev/unity-mcp/releases/latest --jq .tag_name)"
          if ! [[ "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream stable release tag: $upstream_tag" >&2
            exit 1
          fi

          version="${upstream_tag#v}"
          release_tag="vpm-${version}"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "candidate_branch=" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=" >> "$GITHUB_OUTPUT"
            echo "VPM release $release_tag already exists."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Tag $release_tag exists without a GitHub release." >&2
            exit 1
          fi

          git remote add upstream https://github.com/CoplayDev/unity-mcp.git
          git fetch --force --no-tags upstream \
            refs/heads/main:refs/remotes/upstream/main \
            "refs/tags/${upstream_tag}:refs/remotes/upstream/stable-release"
          upstream_main="$(git rev-parse refs/remotes/upstream/main)"
          release_commit="$(git rev-parse refs/remotes/upstream/stable-release^{commit})"

          if ! git merge-base --is-ancestor "$upstream_main" "$main_sha"; then
            echo "Fork main does not yet contain upstream main at $upstream_main." >&2
            echo "Synchronize main before creating $release_tag." >&2
            exit 1
          fi

          overlay_patch="$RUNNER_TEMP/fork-overlay.patch"
          git diff --binary --full-index "$upstream_main" "$main_sha" -- \
            . \
            ':(exclude,glob).github/workflows/**' \
            ':(exclude,glob).github/vpm/**' \
            ':(exclude)VPM.md' \
            > "$overlay_patch"

          git switch --detach "$release_commit"
          if [[ -s "$overlay_patch" ]]; then
            if ! git apply --3way --index "$overlay_patch"; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              echo "::error title=Release overlay conflict::The current fork changes could not be applied to upstream $upstream_tag."
              {
                echo "## Manual release synchronization required"
                echo
                echo "The fork overlay conflicts with upstream release \`$upstream_tag\`:"
                echo
                echo '```text'
                echo "$conflicts"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          git restore --source="$main_sha" --staged --worktree -- \
            .github/workflows \
            .github/vpm \
            VPM.md

          package_version="$(jq -r '.version' MCPForUnity/package.json)"
          server_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Server/pyproject.toml)"
          manifest_version="$(jq -r '.version' manifest.json)"
          if [[ "$package_version" != "$version" || \
                "$server_version" != "$version" || \
                "$manifest_version" != "$version" ]]; then
            echo "Release snapshot version mismatch: upstream=$version, package=$package_version, server=$server_version, manifest=$manifest_version" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          candidate_tree="$(git write-tree)"
          candidate_sha="$(
            printf 'Create VPM snapshot for upstream %s\n' "$upstream_tag" |
              git commit-tree "$candidate_tree" -p "$main_sha"
          )"
          git diff --check "$main_sha" "$candidate_sha" -- \
            . ':(exclude,glob)**/*.meta'

          candidate_branch="automation/vpm-${version}-${RUN_ID}"
          git push origin "${candidate_sha}:refs/heads/${candidate_branch}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Prepared $release_tag from upstream $upstream_tag as $candidate_sha."

      - name: Validate localization coverage
        if: steps.candidate.outputs.changed == 'true'
        shell: pwsh
        run: ./.github/vpm/scripts/validate-localization.ps1

      - name: Build and validate the candidate VPM archive
        if: steps.candidate.outputs.changed == 'true'
        shell: pwsh
        run: ./.github/vpm/scripts/build-package.ps1 -Revision "${{ steps.candidate.outputs.candidate_sha }}"

  unity_availability:
    name: Detect Unity test credentials
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - name: Detect Unity test credentials
        id: detect
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$UNITY_LICENSE" ]] || \
             { [[ -n "$UNITY_EMAIL" ]] && [[ -n "$UNITY_PASSWORD" ]] && [[ -n "$UNITY_SERIAL" ]]; }; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Unity tests will be skipped because the repository has no Unity test credentials."

  unity_tests:
    name: Unity release tests
    needs:
      - prepare
      - unity_availability
    if: >-
      needs.prepare.outputs.changed == 'true' &&
      needs.unity_availability.outputs.available == 'true'
    uses: ./.github/workflows/unity-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.candidate_sha }}
    secrets: inherit

  python_tests:
    name: Python release tests
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/python-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.candidate_sha }}

  publish:
    name: Publish the VPM release
    needs:
      - prepare
      - python_tests
      - unity_availability
      - unity_tests
    if: >-
      always() &&
      needs.prepare.outputs.changed == 'true' &&
      needs.python_tests.result == 'success' &&
      needs.unity_availability.result == 'success' &&
      (needs.unity_availability.outputs.available != 'true' ||
      needs.unity_tests.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated release snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}

      - name: Build and validate the VPM archive
        id: package
        shell: pwsh
        run: ./.github/vpm/scripts/build-package.ps1 -Revision "${{ needs.prepare.outputs.candidate_sha }}"

      - name: Publish the GitHub release
        env:
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          DISPLAY_NAME: ${{ steps.package.outputs.display_name }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG was published by another run."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            "$ZIP_PATH#$ARTIFACT_NAME" \
            --target "$CANDIDATE_SHA" \
            --title "$DISPLAY_NAME $PACKAGE_VERSION" \
            --notes "VPM distribution of upstream $UPSTREAM_TAG with the VRCLearn fork localization. Source authorship and the MIT license remain with CoplayDev and the upstream contributors."

      - name: Refresh the VPM repository listing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run vpm-listing.yml --ref main

  cleanup:
    name: Remove the temporary release snapshot branch
    needs:
      - prepare
      - publish
    if: always() && needs.prepare.outputs.candidate_branch != ''
    runs-on: ubuntu-latest
    steps:
      - name: Delete the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${CANDIDATE_BRANCH}" \
            >/dev/null 2>&1 || true
