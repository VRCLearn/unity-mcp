name: Report VPM automation failures

on:
  workflow_run:
    workflows:
      - Build VPM repository listing
      - Release VPM package
      - Sync upstream main
      - Validate VPM package
    types:
      - completed

permissions: {}

jobs:
  report:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.head_branch == github.event.repository.default_branch ||
        github.event.workflow_run.event == 'release'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create, update, or close the failure issue
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TITLE: "[automation] ${{ github.event.workflow_run.name }} failed"
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail

          # Retry reads only: replaying issue writes could duplicate notifications.
          gh_read() {
              local attempt output error_file status
              error_file="$(mktemp)" || return 1
              for attempt in 1 2 3 4; do
                  if output="$(gh "$@" 2>"$error_file")"; then
                      cat "$error_file" >&2
                      rm -f "$error_file"
                      printf '%s\n' "$output"
                      return 0
                  else
                      status=$?
                  fi
                  cat "$error_file" >&2
                  if (( attempt == 4 )) ||
                     ! grep -Eq 'HTTP (500|502|503|504)([^0-9]|$)' "$error_file"; then
                      rm -f "$error_file"
                      return "$status"
                  fi
                  echo "GitHub API read failed temporarily; retrying ($attempt/3)." >&2
                  sleep "$((2 ** attempt))"
              done
          }

          legacy_title=""
          if [[ "$WORKFLOW_NAME" == "Sync upstream main" ]]; then
            legacy_title="[automation] Sync stable upstream release failed"
          fi

          existing_number="$(
            gh_read issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              | jq -r \
                  --arg title "$TITLE" \
                  --arg legacy "$legacy_title" \
                  'first(.[] | select(.title == $title or (.title == $legacy and $legacy != "")) | .number) // empty'
          )"

          if [[ "$CONCLUSION" == "success" ]]; then
            if [[ -n "$existing_number" ]]; then
              gh issue close "$existing_number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Automation recovered in **${WORKFLOW_NAME}**: [open successful run](${RUN_URL}) (commit \`${HEAD_SHA}\`)."
            fi
            exit 0
          fi

          if [[ "$CONCLUSION" != "failure" && "$CONCLUSION" != "timed_out" ]]; then
            echo "Conclusion $CONCLUSION does not require an issue."
            exit 0
          fi

          upstream_value=""
          upstream_context=""
          next_step=""
          if [[ "$WORKFLOW_NAME" == "Sync upstream main" ]]; then
            upstream_value="$(gh_read api repos/CoplayDev/unity-mcp/commits/main --jq .sha)"
            upstream_context="$(printf '\n- Upstream main: `%s`' "$upstream_value")"
            next_step="$(printf '\n\nIf the run reports upstream workflow changes, open the repository Code page and choose **Sync fork → Update branch**. The resulting push will retry synchronization automatically.')"
          elif [[ "$WORKFLOW_NAME" == "Release VPM package" ]]; then
            upstream_value="$(gh_read api repos/CoplayDev/unity-mcp/releases/latest --jq .tag_name)"
            upstream_context="$(printf '\n- Latest upstream release: `%s`' "$upstream_value")"
          fi

          fingerprint="$(
            printf '%s' "${WORKFLOW_NAME}|${CONCLUSION}|${HEAD_SHA}|${upstream_value}" \
              | git hash-object --stdin
          )"
          fingerprint_marker="<!-- automation-failure-fingerprint:${fingerprint} -->"

          printf -v issue_body \
            'The automated workflow **%s** failed and may require attention.\n\n- Run: [open workflow run](%s)\n- Event: `%s`\n- Commit: `%s`%s%s\n\nThis issue was created automatically and will close after a successful recovery run. Repeated checks of the same upstream state do not add another notification.\n\n%s' \
            "$WORKFLOW_NAME" "$RUN_URL" "$RUN_EVENT" "$HEAD_SHA" "$upstream_context" "$next_step" "$fingerprint_marker"

          if [[ -n "$existing_number" ]]; then
            existing_body="$(
              gh_read issue view "$existing_number" \
                --repo "$GITHUB_REPOSITORY" \
                --json body \
                --jq .body
            )"
            if [[ "$existing_body" == *"$fingerprint_marker"* ]]; then
              echo "Failure $fingerprint was already reported; leaving the issue unchanged."
              exit 0
            fi

            gh issue comment "$existing_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "A different failure occurred in **${WORKFLOW_NAME}**: [open workflow run](${RUN_URL}) (commit \`${HEAD_SHA}\`)."
            gh issue edit "$existing_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$issue_body"
            exit 0
          fi

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body "$issue_body"

  reconcile:
    if: >-
      always() &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: report
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Close stale failure issues after recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Retry reads only: replaying issue writes could duplicate notifications.
          gh_read() {
              local attempt output error_file status
              error_file="$(mktemp)" || return 1
              for attempt in 1 2 3 4; do
                  if output="$(gh "$@" 2>"$error_file")"; then
                      cat "$error_file" >&2
                      rm -f "$error_file"
                      printf '%s\n' "$output"
                      return 0
                  else
                      status=$?
                  fi
                  cat "$error_file" >&2
                  if (( attempt == 4 )) ||
                     ! grep -Eq 'HTTP (500|502|503|504)([^0-9]|$)' "$error_file"; then
                      rm -f "$error_file"
                      return "$status"
                  fi
                  echo "GitHub API read failed temporarily; retrying ($attempt/3)." >&2
                  sleep "$((2 ** attempt))"
              done
          }

          default_branch="$(gh_read api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          workflows=(
            "Build VPM repository listing"
            "Release VPM package"
            "Sync upstream main"
            "Validate VPM package"
          )

          open_issues="$(
            gh_read issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title
          )"

          for workflow_name in "${workflows[@]}"; do
            title="[automation] ${workflow_name} failed"
            legacy_title=""
            if [[ "$workflow_name" == "Sync upstream main" ]]; then
              legacy_title="[automation] Sync stable upstream release failed"
            fi

            existing_number="$(
              printf '%s\n' "$open_issues" \
                | jq -r \
                    --arg title "$title" \
                    --arg legacy "$legacy_title" \
                    'first(.[] | select(.title == $title or (.title == $legacy and $legacy != "")) | .number) // empty'
            )"
            if [[ -z "$existing_number" ]]; then
              continue
            fi

            latest_run="$(
              gh_read run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow_name" \
                --limit 50 \
                --json conclusion,event,headBranch,headSha,url \
                | jq -c \
                    --arg default_branch "$default_branch" \
                    'first(
                      .[]
                      | select(
                          (.headBranch == $default_branch or .event == "release") and
                          (.conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out")
                        )
                    ) // empty'
            )"
            if [[ -z "$latest_run" ]] || \
               [[ "$(jq -r .conclusion <<< "$latest_run")" != "success" ]]; then
              continue
            fi

            run_url="$(jq -r .url <<< "$latest_run")"
            head_sha="$(jq -r .headSha <<< "$latest_run")"
            gh issue close "$existing_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Automation recovery was confirmed by the latest successful **${workflow_name}** run: [open successful run](${run_url}) (commit \`${head_sha}\`)."
          done
