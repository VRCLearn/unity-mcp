name: Report VPM automation failures

on:
  workflow_run:
    workflows:
      - Build VPM repository listing
      - Release VPM package
      - Sync stable upstream release
      - Validate VPM package
    types:
      - completed

permissions: {}

jobs:
  report:
    if: github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create, update, or close the failure issue
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TITLE: "[automation] ${{ github.event.workflow_run.name }} failed"
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail

          existing_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == env.TITLE) | .number' \
              | head -n 1
          )"

          if [[ "$CONCLUSION" == "success" ]]; then
            if [[ -n "$existing_number" ]]; then
              gh issue close "$existing_number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Automation recovered in **${WORKFLOW_NAME}**: [open successful run](${RUN_URL}) (commit \`${HEAD_SHA}\`)."
            fi
            exit 0
          fi

          if [[ "$CONCLUSION" != "failure" && "$CONCLUSION" != "timed_out" ]]; then
            echo "Conclusion $CONCLUSION does not require an issue."
            exit 0
          fi

          if [[ -n "$existing_number" ]]; then
            gh issue comment "$existing_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Another failure occurred in **${WORKFLOW_NAME}**: [open workflow run](${RUN_URL}) (commit \`${HEAD_SHA}\`)."
            exit 0
          fi

          printf -v issue_body \
            'The automated workflow **%s** failed and may require attention.\n\n- Run: [open workflow run](%s)\n- Event: `%s`\n- Commit: `%s`\n\nThis issue was created automatically and will close after a successful recovery run.' \
            "$WORKFLOW_NAME" "$RUN_URL" "$RUN_EVENT" "$HEAD_SHA"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body "$issue_body"
